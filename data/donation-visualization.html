<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Villa Gardenia - Donation Visualization</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
        }

        #container {
            display: flex;
            height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        #sidebar {
            width: 320px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        #map-container {
            flex: 1;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
            border-radius: 16px;
        }

        h1 {
            font-size: 24px;
            color: #2d3748;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .subtitle {
            color: #718096;
            font-size: 14px;
            margin-bottom: 16px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 16px;
            border-radius: 12px;
            color: white;
        }

        .stat-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.9;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
        }

        .legend {
            background: #f7fafc;
            padding: 16px;
            border-radius: 12px;
        }

        .legend-title {
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .legend-color {
            width: 32px;
            height: 20px;
            border-radius: 4px;
            margin-right: 10px;
            border: 1px solid rgba(0,0,0,0.1);
        }

        .category-section {
            background: #f7fafc;
            padding: 16px;
            border-radius: 12px;
        }

        .category-title {
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .category-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .category-item:last-child {
            border-bottom: none;
        }

        .category-label {
            font-size: 13px;
            color: #4a5568;
        }

        .category-count {
            font-weight: 600;
            color: #667eea;
            background: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
        }

        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .popup-content {
            padding: 4px;
            min-width: 200px;
        }

        .popup-header {
            font-size: 18px;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #667eea;
        }

        .popup-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 13px;
        }

        .popup-label {
            color: #718096;
            font-weight: 500;
        }

        .popup-value {
            color: #2d3748;
            font-weight: 600;
        }

        .popup-amount {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-top: 8px;
        }

        .popup-amount-label {
            font-size: 11px;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .popup-amount-value {
            font-size: 20px;
            font-weight: 700;
            margin-top: 4px;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            background: #48bb78;
            color: white;
        }

        .badge.sponsor {
            background: #ed8936;
        }

        .top-donors {
            background: #f7fafc;
            padding: 16px;
            border-radius: 12px;
        }

        .top-donors-title {
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .donor-item {
            display: flex;
            align-items: center;
            padding: 8px;
            margin-bottom: 6px;
            background: white;
            border-radius: 8px;
            transition: transform 0.2s;
            cursor: pointer;
        }

        .donor-item:hover {
            transform: translateX(4px);
        }

        .donor-rank {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            margin-right: 10px;
            flex-shrink: 0;
        }

        .donor-info {
            flex: 1;
            min-width: 0;
        }

        .donor-nbr {
            font-weight: 600;
            color: #2d3748;
            font-size: 13px;
        }

        .donor-amount {
            color: #667eea;
            font-size: 12px;
            font-weight: 600;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }

        @media (max-width: 768px) {
            #container {
                flex-direction: column;
                padding: 10px;
            }

            #sidebar {
                width: 100%;
                max-height: 40vh;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 1000;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="sidebar">
            <div>
                <h1>Villa Gardenia</h1>
                <div class="subtitle">Donation Visualization Dashboard</div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Total Donations</div>
                    <div class="stat-value" id="total-amount">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Contributors</div>
                    <div class="stat-value" id="total-contributors">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Avg Donation</div>
                    <div class="stat-value" id="avg-donation">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Parcels</div>
                    <div class="stat-value" id="total-parcels">-</div>
                </div>
            </div>

            <div class="legend">
                <div class="legend-title">Donation Amount Legend</div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #10b981;"></div>
                    <span>> 3M IDR</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #3b82f6;"></div>
                    <span>1M - 3M IDR</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #8b5cf6;"></div>
                    <span>500K - 1M IDR</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #f59e0b;"></div>
                    <span>200K - 500K IDR</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #ef4444;"></div>
                    <span>< 200K IDR</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #d1d5db;"></div>
                    <span>No Data</span>
                </div>
            </div>

            <div class="category-section">
                <div class="category-title">By Category</div>
                <div class="category-item">
                    <span class="category-label">Warga</span>
                    <span class="category-count" id="warga-count">-</span>
                </div>
                <div class="category-item">
                    <span class="category-label">Sponsor & Warga</span>
                    <span class="category-count" id="sponsor-count">-</span>
                </div>
            </div>

            <div class="top-donors">
                <div class="top-donors-title">Top 10 Contributors</div>
                <div id="top-donors-list"></div>
            </div>
        </div>

        <div id="map-container">
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <div>Loading map data...</div>
            </div>
            <div id="map"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Parse CSV data
        const csvData = `BLOK,NBR,CASH,VALUE,KATEGORI

A,A-4,500178,500178,WARGA

G,G-2,275000,275000,WARGA

G,G-26,100178,100178,WARGA
G,G-28,500000,500000,SPONSOR&WARGA
G,G-4,300178,300178,WARGA
G,G-5,100178,100178,WARGA
G,G-7,500178,500178,SPONSOR&WARGA
G,G-9,300178,300178,WARGA
H,H-1,1000178,1000178,WARGA
H,H-12,300000,300000,WARGA
H,H-23,300000,300000,WARGA
H,H-26,500178,500178,WARGA

M,M-10,500178,500178,WARGA
M,M-10,1000178,1000178,WARGA
M,M-11,300178,300178,WARGA
M,M-12,100012,100012,WARGA
M,M-14,,35000000,SPONSOR&WARGA
M,M-15,325178,325178,WARGA
M,M-16,250178,250178,WARGA
M,M-17,300178,300178,WARGA
M,M-5,300178,300178,WARGA
M,M-9,200178,200178,WARGA
N,N-1,150178,150178,WARGA

N,N-4,300178,300178,WARGA
N,N-5,400178,400178,WARGA

O,O-1,400178,400178,WARGA
O,O-4,100178,100178,WARGA
O,O-5,300128,300128,WARGA

P,P-2,200178,200178,WARGA
P,P-5,3124178,3124178,SPONSOR&WARGA
P,P-8,600178,600178,WARGA
Q,Q-1,500178,500178,WARGA
Q,Q-2,120000,120000,WARGA
Q,Q-3,500178,500178,SPONSOR&WARGA
Q,Q-5,275178,275178,WARGA
Q,Q-6,500178,500178,WARGA
Q,Q-7,300178,300178,WARGA
Q,Q-8,200178,200178,WARGA
Q,Q-9,500000,500000,SPONSOR&WARGA
R,R-1,300178,300178,WARGA
R,R-5,321123,321123,WARGA
R,R-9,300178,300178,WARGA
S,S-2,300178,300178,WARGA
S,S-3,300178,300178,WARGA
S,S-4,178178,178178,WARGA
S,S-6,150178,150178,WARGA
T,T-4,250178,250178,WARGA
T,T-5,100178,100178,WARGA`;

        // Parse CSV into donation map
        const donationMap = new Map();
        const lines = csvData.trim().split('\n');

        for (let i = 1; i < lines.length; i++) {
            const parts = lines[i].split(',');
            if (parts.length >= 5) {
                const nbr = parts[1];
                const value = parseFloat(parts[3]) || 0;
                const category = parts[4];

                // Aggregate donations for same NBR
                if (donationMap.has(nbr)) {
                    const existing = donationMap.get(nbr);
                    existing.value += value;
                    if (category.includes('SPONSOR')) {
                        existing.category = 'SPONSOR&WARGA';
                    }
                } else {
                    donationMap.set(nbr, {
                        blok: parts[0],
                        nbr: nbr,
                        value: value,
                        category: category
                    });
                }
            }
        }

        // Get color based on donation amount
        function getColor(value) {
            if (value > 3000000) return '#10b981'; // green
            if (value > 1000000) return '#3b82f6'; // blue
            if (value > 500000) return '#8b5cf6';  // purple
            if (value > 200000) return '#f59e0b';  // amber
            if (value > 0) return '#ef4444';       // red
            return '#d1d5db';                      // gray
        }

        // Format currency
        function formatCurrency(value) {
            if (value >= 1000000) {
                return (value / 1000000).toFixed(2) + 'M';
            } else if (value >= 1000) {
                return (value / 1000).toFixed(0) + 'K';
            }
            return value.toFixed(0);
        }

        // Initialize map
        const map = L.map('map').setView([-7.8359, 110.3313], 17);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            maxZoom: 19
        }).addTo(map);

        // Load GeoJSON and add to map
        fetch('villa-gardenia.geojson')
            .then(response => response.json())
            .then(geojson => {
                const parcelsLayer = L.geoJSON(geojson, {
                    style: function(feature) {
                        const nbr = feature.properties.NBR;
                        const donation = donationMap.get(nbr);
                        const color = donation ? getColor(donation.value) : '#d1d5db';

                        return {
                            fillColor: color,
                            weight: 2,
                            opacity: 1,
                            color: 'white',
                            fillOpacity: 0.7
                        };
                    },
                    onEachFeature: function(feature, layer) {
                        const nbr = feature.properties.NBR;
                        const donation = donationMap.get(nbr);

                        let popupContent = `
                            <div class="popup-content">
                                <div class="popup-header">${nbr}</div>
                                <div class="popup-row">
                                    <span class="popup-label">Block:</span>
                                    <span class="popup-value">${feature.properties.BLOK}</span>
                                </div>
                                <div class="popup-row">
                                    <span class="popup-label">Address:</span>
                                    <span class="popup-value">${feature.properties.ALAMAT}</span>
                                </div>
                        `;

                        if (donation) {
                            const categoryClass = donation.category.includes('SPONSOR') ? 'sponsor' : '';
                            popupContent += `
                                <div class="popup-row">
                                    <span class="popup-label">Category:</span>
                                    <span class="badge ${categoryClass}">${donation.category}</span>
                                </div>
                                <div class="popup-amount">
                                    <div class="popup-amount-label">Total Donation</div>
                                    <div class="popup-amount-value">Rp ${donation.value.toLocaleString('id-ID')}</div>
                                </div>
                            `;
                        } else {
                            popupContent += `
                                <div class="popup-row">
                                    <span class="popup-value" style="color: #718096;">No donation data</span>
                                </div>
                            `;
                        }

                        popupContent += '</div>';

                        layer.bindPopup(popupContent);

                        // Hover effect
                        layer.on('mouseover', function() {
                            this.setStyle({
                                weight: 3,
                                color: '#667eea',
                                fillOpacity: 0.9
                            });
                        });

                        layer.on('mouseout', function() {
                            parcelsLayer.resetStyle(this);
                        });
                    }
                }).addTo(map);

                // Fit map to layer bounds
                map.fitBounds(parcelsLayer.getBounds());

                // Calculate statistics
                const donations = Array.from(donationMap.values());
                const totalAmount = donations.reduce((sum, d) => sum + d.value, 0);
                const totalContributors = donations.length;
                const avgDonation = totalAmount / totalContributors;
                const wargaCount = donations.filter(d => d.category === 'WARGA').length;
                const sponsorCount = donations.filter(d => d.category.includes('SPONSOR')).length;
                const totalParcels = geojson.features.length;

                // Update stats
                document.getElementById('total-amount').textContent = 'Rp ' + formatCurrency(totalAmount);
                document.getElementById('total-contributors').textContent = totalContributors;
                document.getElementById('avg-donation').textContent = 'Rp ' + formatCurrency(avgDonation);
                document.getElementById('total-parcels').textContent = totalParcels;
                document.getElementById('warga-count').textContent = wargaCount;
                document.getElementById('sponsor-count').textContent = sponsorCount;

                // Top donors
                const topDonors = donations.sort((a, b) => b.value - a.value).slice(0, 10);
                const topDonorsList = document.getElementById('top-donors-list');

                topDonors.forEach((donor, index) => {
                    const donorItem = document.createElement('div');
                    donorItem.className = 'donor-item';
                    donorItem.innerHTML = `
                        <div class="donor-rank">${index + 1}</div>
                        <div class="donor-info">
                            <div class="donor-nbr">${donor.nbr}</div>
                            <div class="donor-amount">Rp ${donor.value.toLocaleString('id-ID')}</div>
                        </div>
                    `;

                    // Click to zoom to parcel
                    donorItem.addEventListener('click', function() {
                        parcelsLayer.eachLayer(function(layer) {
                            if (layer.feature.properties.NBR === donor.nbr) {
                                map.fitBounds(layer.getBounds(), { maxZoom: 19 });
                                layer.openPopup();
                            }
                        });
                    });

                    topDonorsList.appendChild(donorItem);
                });

                // Hide loading
                document.getElementById('loading').style.display = 'none';
            })
            .catch(error => {
                console.error('Error loading GeoJSON:', error);
                document.getElementById('loading').innerHTML = '<div style="color: #ef4444;">Error loading map data</div>';
            });
    </script>
</body>
</html>
